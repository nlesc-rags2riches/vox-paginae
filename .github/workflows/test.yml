name: Test
on:
  push:
    branches: [main]
  pull_request:
    # `labeled`: adding `pr/test-all-os` starts a run on all OSs (any label starts a run).
    types: [opened, synchronize, reopened, labeled]
    # Skip pull requests that change only Markdown or docs/. A path that a test reads
    # must still start a run: list it after the `!` lines, which it then overrides.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      # The how-to tests rewrite their pages and screenshots, and the e2e job checks them.
      - "docs/how-to/**"
  workflow_dispatch:
# A new run on the same pull request cancels the older one; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # A file opened without `encoding=` fails the tests (see pyproject.toml).
  PYTHONWARNDEFAULTENCODING: "1"
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps: &unit-steps
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked pytest
  unit-other-os:
    # A pull request skips these, unless it has the `pr/test-all-os` label.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'pr/test-all-os')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps: *unit-steps
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --locked playwright install chromium
      - run: uv run --locked pytest -m e2e
      # The how-to tests rewrote their pages: they must match the committed ones.
      - run: git add --intent-to-add docs/how-to && git diff --exit-code docs/how-to
      # Traces and screenshots of failed browser tests (see pyproject.toml).
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
