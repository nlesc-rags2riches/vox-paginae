name: Test
on:
  push:
    branches: [main]
  pull_request:
    # `labeled`: adding `pr/test-all-os` starts a run on all OSs (any label starts a run).
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
# A new run on the same pull request cancels the older one; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # A file opened without `encoding=` fails the tests (see pyproject.toml).
  PYTHONWARNDEFAULTENCODING: "1"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uvx prek run --all-files --show-diff-on-failure
        env:
          # CI checks out main as a branch.
          SKIP: no-commit-to-branch
  unit:
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs on ubuntu only, unless it has the `pr/test-all-os` label.
        os: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'pr/test-all-os')) && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked pytest
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --locked playwright install --with-deps chromium
      - run: uv run --locked pytest -m e2e
