name: Lint
# No path filter: prek also lints Markdown, so docs-only pull requests need it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A new run on the same pull request cancels the older one; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uvx prek run --all-files --show-diff-on-failure
        env:
          # CI checks out main as a branch.
          SKIP: no-commit-to-branch
