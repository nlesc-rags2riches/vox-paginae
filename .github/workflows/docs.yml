name: Docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A new run on the same pull request cancels the older one; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - run: uv run --locked --only-group docs zensical build --strict
