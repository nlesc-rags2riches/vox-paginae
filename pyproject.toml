[project]
name = "vox-paginae"
version = "0.1.0"
description = "Annotates scanned death-duty deeds (MVP, work in progress)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Abel Soares Siqueira", email = "abel.siqueira@esciencecenter.nl" }
]
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"

[tool.pytest.ini_options]
markers = [
    "e2e: browser tests (Playwright); run with `pytest -m e2e`",
    "howto(title): a how-to test; its page is titled `title` (see tests/e2e/test_howtos.py)",
]
# A failed browser test leaves a trace and a screenshot in test-results/.
# Open the trace with `uv run playwright show-trace <trace.zip>`.
addopts = "-m 'not e2e' --tracing retain-on-failure --screenshot only-on-failure"
# With PYTHONWARNDEFAULTENCODING=1 (CI sets it), a file opened without `encoding=`
# fails on every OS, not only where the default is not UTF-8.
# matplotlib writes its font cache that way on first import (fresh CI runner): not ours.
filterwarnings = [
    "error::EncodingWarning",
    "ignore::EncodingWarning:matplotlib",
]

[tool.marimo.runtime]
# marimo sizes outputs with sys.getsizeof, so one character outside Latin-1 (ƒ, ’) in the
# Vox Paginae layout counts its ~5 MB page PNG double, an emoji 4x. The PNG
# itself is capped in vox_paginae.ui; this only stops the overcount.
output_max_bytes = 25_000_000
# Cells importing a changed module (e.g. src/vox_paginae/annotation.py) are marked stale, so
# a library edit never leaves the live kernel silently running old code.
auto_reload = "lazy"

[tool.ruff.lint.per-file-ignores]
# marimo writes the bare `return` that ends a cell with no outputs.
"notebooks/*.py" = ["PLR1711"]

[tool.ruff.format]
# marimo formats the notebook itself, at its own width, on every save.
exclude = ["notebooks/*.py"]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]
docs = [
    "zensical>=0.0.74",
]
