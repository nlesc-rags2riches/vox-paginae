repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10 # same as uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-fmt-skip
        name: ruff formats every line
        language: pygrep
        entry: '#\s*fmt:\s*(skip|off)'
        types: [python]
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
      - id: check-case-conflict
      - id: detect-private-key
