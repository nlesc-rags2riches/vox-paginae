repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10 # same as uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-fmt-skip
        name: ruff formats every line
        language: pygrep
        entry: '#\s*fmt:\s*(skip|off)'
        types: [python]
